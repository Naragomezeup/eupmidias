<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Kit E.UP</title>
<meta name="description" content="E.UP. Simplesmente diferente. Mais de 36 soluções de mídia em seis frentes de atuação.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,500&family=Outfit:wght@300;400;500;600;700&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
<style>
/* Layout: páginas 16:9 (lona de 1920×1080) empilhadas na vertical, como o media kit no Canva; cada página é escalada para a largura da tela. Templates: KV capa, institucionais, mandala, menu e miolo de produto, encerramento KV. Tema único (identidade da campanha). */
:root{
  --paper:#F6F4F8;
  --ink:#17183B;
  --red:#CC1338;
  --coral:#FD3A60;
  --lilac:#D7C5ED;
  --indigo:#4A3F7C;
  --muted:#5D5A78;
  --canvas:#E4E1EA;
  --line:rgba(23,24,59,.14);
  --f-serif:"Playfair Display", "Didot", "Bodoni 72", Georgia, serif;
  --f-display:"Outfit", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Figtree", "Avenir Next", "Segoe UI", Arial, sans-serif;
  --s:.6;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--canvas);color:var(--ink);font:400 16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:4px}

/* barra superior */
.top{position:sticky;top:0;z-index:50;height:60px;background:rgba(246,244,248,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .in{max-width:1680px;margin:0 auto;height:100%;display:flex;align-items:center;gap:18px;padding:0 20px}
.top .brand img{height:30px;width:auto}
.top nav{display:flex;gap:2px;margin-left:auto;align-items:center;overflow-x:auto;scrollbar-width:none}
.top nav::-webkit-scrollbar{display:none}
.top nav a{font:500 14px/1 var(--f-body);text-decoration:none;padding:10px 12px;border-radius:99px;white-space:nowrap}
.top nav a:hover{background:rgba(23,24,59,.07)}
.top nav a.cta{background:var(--ink);color:#fff;padding:11px 16px;margin-left:6px}
.top nav a.cta:hover{background:var(--red)}
@media (max-width:760px){.top nav a:not(.cta):not(.k){display:none}}

/* deck */
.deck{display:grid;justify-items:center;gap:clamp(14px,2.2vw,32px);padding:clamp(14px,2.2vw,32px) clamp(10px,2vw,32px) 80px}
.frame{position:relative;width:100%;max-width:1600px;aspect-ratio:16/9;overflow:hidden;background:var(--paper);box-shadow:0 1px 2px rgba(23,24,59,.08),0 18px 40px -24px rgba(23,24,59,.35);scroll-margin-top:76px}
.slide{position:absolute;left:0;top:0;width:1920px;height:1080px;transform:scale(var(--s));transform-origin:0 0;overflow:hidden;font-size:24px;line-height:1.45}
.pgnum{position:absolute;right:28px;bottom:18px;font:600 15px var(--f-body);color:rgba(23,24,59,.4);z-index:4}

/* elementos comuns */
.eyebrow{font:700 18px/1 var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:var(--red)}
.serif{font-family:var(--f-serif);font-style:italic;font-weight:400}
.dot{color:var(--red)}
.btn{display:inline-flex;align-items:center;gap:14px;font:600 24px/1 var(--f-body);text-decoration:none;padding:24px 36px;border-radius:99px;border:2px solid var(--ink);color:var(--ink);background:transparent;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.btn:hover{background:var(--ink);color:#fff}
.btn.solid{background:var(--red);border-color:var(--red);color:#fff}
.btn.solid:hover{background:var(--ink);border-color:var(--ink)}
.btn.sm{font-size:20px;padding:16px 26px}
.mist{position:absolute;inset:0;background:
  radial-gradient(900px 700px at 100% 0%, rgba(215,197,237,.9), transparent 65%),
  radial-gradient(800px 600px at 0% 100%, rgba(253,58,96,.22), transparent 65%),
  var(--paper)}
.tag{font:700 14px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;border-radius:99px;white-space:nowrap}
.tag.live{background:var(--red);color:#fff}
.tag.mig{background:rgba(23,24,59,.08);color:var(--muted)}

/* 01 capa */
.s-capa .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.s-capa h1{position:absolute;left:108px;top:352px;line-height:.86;color:#16163a}
.s-capa h1 .l1{display:block;font:400 italic 190px/.9 var(--f-serif);letter-spacing:-.012em}
.s-capa h1 .l2{display:block;font:400 168px/1 var(--f-display);letter-spacing:-.03em;padding-left:66px}
.s-capa .apoio{position:absolute;left:110px;top:788px;width:470px;font:700 33px/1.32 var(--f-body);color:#16163a}
.s-capa .actions{position:absolute;left:110px;top:940px;display:flex;gap:16px}
.s-capa .social{position:absolute;top:84px;right:122px;display:flex;gap:30px;font:500 22px/1 var(--f-body)}
.s-capa .lockup{position:absolute;left:1372px;top:534px;width:432px}

/* 02 quem somos */
.s-who .l{position:absolute;left:120px;top:150px;width:760px}
.s-who .neither{font:400 64px/1.08 var(--f-display);color:var(--muted);margin-top:36px}
.s-who .diff{font:400 italic 196px/.9 var(--f-serif);letter-spacing:-.02em;margin-top:6px}
.s-who .sig{position:absolute;left:120px;bottom:120px;font:700 26px/1.3 var(--f-body)}
.s-who .r{position:absolute;left:960px;top:150px;width:840px}
.s-who .pres{font:500 34px/1.38 var(--f-body);margin-bottom:44px}
.s-who .mf{border-left:3px solid var(--red);padding-left:32px;display:grid;gap:7px}
.s-who .mf p{font-size:21px;line-height:1.4;color:var(--muted)}
.s-who .mf p.k{color:var(--ink);font-weight:700}

/* 03 jeito */
.s-way .head{position:absolute;left:120px;top:120px;width:1300px}
.s-way h2{font:500 84px/1.02 var(--f-display);letter-spacing:-.025em;margin-top:26px}
.s-way h2 .serif{font-size:1.06em}
.s-way .head p{font-size:28px;color:var(--muted);margin-top:22px}
.s-way .cols{position:absolute;left:120px;right:120px;top:500px;display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-top:2px solid var(--ink)}
.s-way .col{padding:30px 32px 0 0;display:grid;gap:18px;align-content:start}
.s-way .col + .col{padding-left:32px;border-left:1px solid var(--line)}
.s-way .nm{font:700 16px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;display:flex;align-items:center;gap:12px}
.s-way .nm::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--red)}
.s-way .tt{font:400 italic 40px/1.1 var(--f-serif)}
.s-way .tx{font-size:21px;color:var(--muted);line-height:1.45}
.s-way .tx strong{display:block;color:var(--ink);margin-top:12px}

/* 04 números */
.s-num{background:var(--ink);color:#fff}
.s-num::before{content:"";position:absolute;inset:0;background:
  radial-gradient(900px 700px at 96% 0%, rgba(253,58,96,.55), transparent 62%),
  radial-gradient(900px 700px at 0% 100%, rgba(122,98,184,.6), transparent 62%)}
.s-num .head{position:absolute;left:120px;top:120px;width:1200px}
.s-num .eyebrow{color:#FFB6C6}
.s-num h2{font:500 80px/1.02 var(--f-display);letter-spacing:-.025em;margin-top:26px}
.s-num .grid{position:absolute;left:120px;right:120px;top:450px;bottom:120px;display:grid;grid-template-columns:1.05fr .8fr 1.05fr 1.1fr;gap:24px}
.s-num .t{border-radius:36px;padding:44px 40px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);display:flex;flex-direction:column;gap:16px}
.s-num .t .v{font:600 150px/.85 var(--f-display);letter-spacing:-.045em}
.s-num .t .v.w{font:400 italic 100px/.95 var(--f-serif);letter-spacing:-.01em}
.s-num .t .r{font:700 27px/1.25 var(--f-body)}
.s-num .t .x{font-size:21px;color:rgba(255,255,255,.74);margin-top:auto}
.s-num .t.hl{background:linear-gradient(140deg,var(--coral),var(--red));border-color:transparent}
.s-num .t.hl .x{color:rgba(255,255,255,.92)}

/* 05 mandala */
.s-man .l{position:absolute;left:120px;top:110px;width:760px;bottom:90px;display:flex;flex-direction:column}
.s-man h2{font:500 76px/1.02 var(--f-display);letter-spacing:-.025em;margin-top:24px}
.s-man .hint{font-size:24px;color:var(--muted);margin-top:16px}
.s-man .panel{margin-top:36px;background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:32px;padding:30px 36px;flex:1;display:flex;flex-direction:column;min-height:0}
.s-man .panel .fr{display:flex;align-items:center;gap:12px;font:700 15px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase}
.s-man .panel .fr i{width:14px;height:14px;border-radius:50%}
.s-man .panel h3{font:500 44px/1.05 var(--f-display);letter-spacing:-.02em;margin:12px 0 4px}
.s-man .panel .cnt{color:var(--muted);font-size:20px;margin-bottom:12px}
.s-man .panel ul{list-style:none;margin:0;padding:0;columns:2;column-gap:28px;overflow:hidden}
.s-man .panel li{break-inside:avoid;border-top:1px solid var(--line)}
.s-man .panel li a,.s-man .panel li span.o{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;text-decoration:none;font:600 21px/1.2 var(--f-body)}
.s-man .panel li a{color:var(--red)}
.s-man .panel li span.o{color:var(--muted);font-weight:500}
.s-man .wheel{position:absolute;left:880px;top:30px;width:1020px;height:1020px}
.s-man svg{width:100%;height:100%;overflow:visible;user-select:none}
.s-man .seg{cursor:pointer;transition:opacity .25s,transform .35s;transform-origin:350px 350px}
.s-man svg.has .seg:not(.sel){opacity:.36}
.s-man .seg.sel{transform:scale(1.035)}
.s-man .seg:focus-visible{outline:none}
.s-man .seg:focus-visible path:first-child{stroke:var(--ink);stroke-width:3}
.s-man .lbl{font:600 17px var(--f-body);fill:var(--ink);pointer-events:none}
.s-man .pdot{cursor:pointer}
.s-man .tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font:600 20px/1.2 var(--f-body);padding:10px 14px;border-radius:12px;opacity:0;transition:opacity .15s;white-space:nowrap;z-index:5}

/* miolo (template de produto e menu) */
.miolo .bg{position:absolute;inset:0;width:100%;height:100%}
.miolo .back{position:absolute;right:120px;top:70px;z-index:3}
.miolo .front{position:absolute;left:120px;top:84px;display:flex;align-items:center;gap:12px;font:700 17px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase}
.miolo .front i{width:14px;height:14px;border-radius:50%}

/* 06 menu */
.s-menu .head{position:absolute;left:120px;top:90px;width:1300px}
.s-menu h2{font:500 72px/1.02 var(--f-display);letter-spacing:-.025em;margin-top:22px}
.s-menu .legend{position:absolute;right:120px;top:100px;display:flex;gap:26px;font:600 18px var(--f-body);color:var(--muted)}
.s-menu .legend span{display:flex;align-items:center;gap:10px}
.s-menu .legend i{width:12px;height:12px;border-radius:50%;border:2px solid var(--red)}
.s-menu .legend i.f{background:var(--red)}
.s-menu .cols{position:absolute;left:120px;right:120px;top:340px;bottom:170px;display:grid;grid-template-columns:repeat(6,1fr);gap:28px}
.s-menu .c h3{font:600 23px/1.15 var(--f-display);padding-bottom:16px;margin-bottom:8px;border-bottom:3px solid;min-height:76px;display:flex;align-items:flex-end}
.s-menu .c ul{list-style:none;margin:0;padding:0}
.s-menu .c li a,.s-menu .c li span{display:block;padding:8px 0;font:500 21px/1.25 var(--f-body);text-decoration:none;color:var(--muted)}
.s-menu .c li a{color:var(--red);font-weight:700}
.s-menu .c li a::after{content:" →"}
.s-menu .c li a:hover{text-decoration:underline}

/* produto: layouts genéricos (lona 1920×1080; textos em em, base 24px, com ajuste automático) */
.p-open .left{position:absolute;left:120px;top:150px;bottom:150px;width:850px;display:flex;flex-direction:column;justify-content:center;gap:44px}
.p-open .logo{max-width:520px;max-height:190px;width:auto;height:auto;align-self:flex-start}
.p-open .nm{font:600 128px/.95 var(--f-display);letter-spacing:-.04em}
.p-open .nm.long{font-size:100px}
.p-open .call{font:400 italic 70px/1.08 var(--f-serif)}
.p-open .desc{font-size:27px;line-height:1.42;color:var(--muted)}
.p-open .art{position:absolute;left:1060px;top:150px;width:720px;height:720px}
.p-open .art::before{content:"";position:absolute;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--coral),var(--red));right:0;top:20px}
.p-open .art::after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:var(--lilac);left:0;bottom:20px;opacity:.85}
.p-open .art img{position:absolute;z-index:1;left:50%;top:50%;transform:translate(-50%,-50%);max-width:640px;max-height:620px;width:auto;height:auto;filter:drop-shadow(0 40px 50px rgba(23,24,59,.28));border-radius:18px}
.p-open .art.photo img{border-radius:40px;width:560px;height:600px;object-fit:cover;max-height:none}
.p-open .art .lg{position:absolute;z-index:1;left:50%;top:50%;transform:translate(-50%,-50%);width:420px;height:420px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 40px 60px -30px rgba(23,24,59,.35)}
.p-open .art .lg img{position:static;transform:none;max-width:300px;max-height:180px;filter:none;border-radius:0}
.p-open .art .lg b{font:600 64px/1 var(--f-display);text-align:center;padding:0 30px}
.p-open .art.circulo .ph{position:absolute;z-index:1;right:70px;top:80px;width:530px;height:530px;border-radius:50%;overflow:hidden;box-shadow:0 40px 60px -30px rgba(23,24,59,.4)}
.p-open .art.circulo .ph img{position:static;transform:none;width:100%;height:100%;max-width:none;max-height:none;object-fit:cover;border-radius:0;filter:none}
.p-open .art.base .wr{position:absolute;inset:0;z-index:1;-webkit-mask:linear-gradient(#000,#000) 0 0/100% 300px no-repeat,radial-gradient(circle 280px at 440px 300px,#000 99.5%,transparent 100%) 0 0/100% 100% no-repeat;mask:linear-gradient(#000,#000) 0 0/100% 300px no-repeat,radial-gradient(circle 280px at 440px 300px,#000 99.5%,transparent 100%) 0 0/100% 100% no-repeat}
.p-open .art.base .wr img{position:absolute;left:120px;top:0;transform:none;width:620px;max-width:none;max-height:none;border-radius:0}
.p-open .art .lg.multi{gap:26px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.p-open .art .lg.multi img{max-width:210px;max-height:68px}
.funil{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.8em;align-items:stretch}
.funil .et{background:rgba(255,255,255,.85);border:1px solid var(--line);border-top:5px solid var(--red);border-radius:22px;padding:1em;display:flex;flex-direction:column;gap:.6em}
.funil .et:nth-child(2){border-top-color:var(--coral)}.funil .et:nth-child(3){border-top-color:#7A62B8}.funil .et:nth-child(4){border-top-color:var(--indigo)}
.funil .n{font:600 1.4em/1 var(--f-display);color:var(--red)}
.funil h4{font:600 1.3em/1.15 var(--f-display)}
.funil .chips{display:flex;flex-wrap:wrap;gap:.4em}
.funil .chips a{font:600 .95em/1 var(--f-body);text-decoration:none;padding:.55em .8em;border-radius:99px;background:rgba(23,24,59,.06);color:var(--ink)}
.funil .chips a:hover{background:var(--red);color:#fff}
.pg .bd > .side .lgs{display:flex;flex-direction:column;gap:2em;align-items:center;background:#fff;border-radius:30px;padding:2em 2.4em;border:1px solid var(--line)}
.pg .bd > .side .lgs img{max-width:9em;max-height:3em;filter:none;border-radius:0}
.pg .bd > .side img.foto{border-radius:30px;object-fit:cover;width:100%;max-height:100%}
.pg .content{position:absolute;left:120px;right:120px;top:150px;bottom:150px;display:flex;flex-direction:column;gap:1.2em;font-size:24px;line-height:1.4}
.pg .hd{display:grid;gap:.45em;max-width:1300px}
.pg .hd .eb{font:700 .72em/1 var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:var(--red)}
.pg .hd h3{font:500 2.35em/1.05 var(--f-display);letter-spacing:-.025em}
.pg .hd .in{font-size:1em;color:var(--muted);max-width:56em}
.pg .bd{flex:1;min-height:0;display:flex;gap:1.6em}
.pg .bd > .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1em;justify-content:center}
.pg .bd > .side{flex:0 0 36%;display:flex;flex-direction:column;gap:1em;justify-content:center;align-items:center}
.pg .bd > .side.narrow{flex-basis:26%;align-items:stretch;justify-content:flex-start}
.pg .bd > .side img{max-width:100%;max-height:100%;object-fit:contain;border-radius:16px;filter:drop-shadow(0 24px 30px rgba(23,24,59,.2))}
.pg .src{font-size:.68em;color:var(--muted)}
.pg .faixa{background:var(--ink);color:#fff;border-radius:22px;padding:.8em 1.2em;font:600 .92em/1.35 var(--f-body)}
.tiles{display:grid;gap:.7em}
.tile{background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:24px;padding:.85em 1em;display:flex;flex-direction:column;gap:.3em}
.tile .v{font:600 2.5em/1 var(--f-display);letter-spacing:-.035em;color:var(--ink);white-space:nowrap}
.tile .v.long{font-size:1.8em}
.tile .r{font-size:.82em;color:var(--muted);line-height:1.35}
.tiles.hl .tile:first-child .v{color:var(--red)}
.gt{font:700 .7em/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:.2em 0 -.2em}
.lists{display:grid;gap:1em}
.lst h4{font:700 .7em/1.1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:.6em}
.lst ul{list-style:none;margin:0;padding:0;display:grid;gap:.35em}
.lst li{font-weight:600;font-size:.9em;padding-left:1em;position:relative}
.lst li::before{content:"";position:absolute;left:0;top:.55em;width:.4em;height:.4em;border-radius:50%;background:var(--red)}
.logos{display:flex;flex-wrap:wrap;gap:1.2em 2em;align-items:center}
.logos img{height:2.6em;width:auto;max-width:8em;object-fit:contain}
.cards{display:grid;gap:.8em}
.card{background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:26px;padding:1em 1.1em;display:flex;flex-direction:column;gap:.45em}
.card .cv{font:600 1.9em/1 var(--f-display);color:var(--red);letter-spacing:-.03em}
.card h4{font:600 1.12em/1.15 var(--f-display);display:flex;gap:.5em;align-items:baseline}
.card p{font-size:.84em;color:var(--muted);line-height:1.42}
.pars{display:grid;gap:.8em}
.pars p{font-size:1em;line-height:1.45}
.pars p:first-child{font-size:1.08em;font-weight:500}
.spec{display:grid;border-top:3px solid var(--ink)}
.spec > div{padding:.9em .9em .9em 0}
.spec > div + div{padding-left:.9em;border-left:1px solid var(--line)}
.spec h4{font:700 .7em/1.1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:.7em}
.spec ul{list-style:none;margin:0;padding:0;display:grid;gap:.4em;font:600 .9em/1.3 var(--f-body)}
.steps{display:grid;gap:.8em;counter-reset:st}
.step{position:relative;background:rgba(255,255,255,.85);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:20px;padding:1em 1.05em;display:flex;flex-direction:column;gap:.45em}
.step .n{font:600 1.5em/1 var(--f-display);color:var(--red)}
.step h4{font:600 1.05em/1.15 var(--f-display)}
.step p{font-size:.82em;color:var(--muted)}
.gal{display:grid;gap:1em;align-items:start}
.gal figure{margin:0;display:flex;flex-direction:column;gap:.6em}
.gal img{width:100%;max-height:520px;object-fit:contain;border-radius:16px;background:#fff;border:1px solid var(--line)}
.gal figcaption{font-size:.8em;color:var(--muted);line-height:1.35}
.gal figcaption b{color:var(--ink)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:22px;overflow:hidden;border:1px solid var(--line);font-size:.9em}
.tbl th{background:var(--red);color:#fff;text-align:left;padding:.8em 1em;font:700 .85em var(--f-body)}
.tbl td{padding:.85em 1em;border-top:1px solid var(--line);vertical-align:top;color:var(--muted)}
.tbl td:first-child{color:var(--red);font-weight:700}
.big{display:flex;flex-direction:column;justify-content:center;gap:.6em}
.big .v{font:600 9em/.82 var(--f-display);letter-spacing:-.055em;color:var(--red);white-space:nowrap}
.big .v.long{font-size:6em}
.big .v.xlong{font-size:4.6em}
.big .r{font:700 1.5em/1.22 var(--f-body);max-width:14em}
.chart{display:grid;grid-template-columns:15em 1fr;gap:1.6em;align-items:center}
.chart h4{grid-column:1/-1;font:500 1.55em/1.1 var(--f-display)}
.chart svg{width:100%;height:auto}
.legend{list-style:none;margin:0;padding:0}
.legend li{display:grid;grid-template-columns:.75em 1fr auto;gap:.65em;align-items:center;padding:.6em 0;border-bottom:1px solid var(--line);font-weight:600}
.legend li i{width:.75em;height:.75em;border-radius:50%}
.legend li b{font:600 1.3em var(--f-display)}
.chart .fs{grid-column:1/-1;font-size:.68em;color:var(--muted)}

/* encerramento */
.s-end .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.s-end .head{position:absolute;left:0;right:0;top:150px;text-align:center}
.s-end h2{font:500 84px/1.02 var(--f-display);letter-spacing:-.03em}
.s-end h2 .serif{display:block;font-size:.86em;color:var(--indigo);margin-top:8px}
.s-end .lockup{position:absolute;left:426px;top:476px;width:716px}
.s-end .qr{position:absolute;left:1222px;top:448px;width:236px;border-radius:10px}
.s-end .contacts{position:absolute;left:0;right:0;top:810px;display:flex;justify-content:center;align-items:center;gap:52px;font:600 28px var(--f-display)}
.s-end .contacts a{text-decoration:none}
.s-end .contacts small{display:block;font:700 14px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}

/* notas de revisão */
.nota{display:none;position:absolute;left:120px;bottom:30px;z-index:6;max-width:1200px;font:600 18px/1.4 var(--f-body);color:#5a3b00;background:#FFF2C7;border:1px solid #F2D27A;border-radius:14px;padding:12px 16px}
body.review .nota{display:block}
.review-toggle{position:fixed;left:14px;bottom:14px;z-index:60;font:600 13px/1 var(--f-body);background:#FFF2C7;color:#5a3b00;border:1px solid #F2D27A;border-radius:99px;padding:11px 15px;cursor:pointer;box-shadow:0 10px 24px -14px rgba(0,0,0,.4)}
.review-toggle[aria-pressed="true"]{background:#5a3b00;color:#FFF2C7}
.rotate{display:none;position:fixed;right:14px;bottom:14px;z-index:60;background:var(--ink);color:#fff;font:600 13px/1.3 var(--f-body);padding:10px 14px;border-radius:12px;max-width:210px}
@media (orientation:portrait) and (max-width:700px){.rotate{display:block}}
.top nav button.pdf{font:600 14px/1 var(--f-body);padding:10px 14px;border-radius:99px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap;margin-left:6px}
.top nav button.pdf:hover{background:var(--ink);color:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;font:600 14px/1.4 var(--f-body);padding:12px 18px;border-radius:12px;max-width:min(90vw,520px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media print{@page{size:1920px 1080px;margin:0}html,body{width:1920px}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.top,.review-toggle,.rotate,.toast,.back,.nota,.actions{display:none!important}body{background:#fff}.deck{padding:0!important;gap:0!important;display:block}.frame{max-width:none!important;width:1920px!important;height:1080px!important;aspect-ratio:auto;box-shadow:none;break-after:page;page-break-after:always;margin:0}.slide{transform:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <a class="brand" href="#inicio" aria-label="E.UP Mídias, ir para a capa"><img src="assets/logo-eup.png" alt="E.UP Mídias"></a>
    <nav aria-label="Páginas">
      <a href="#quem-somos">Quem somos</a>
      <a href="#jeito">Nosso jeito</a>
      <a href="#numeros">Números</a>
      <a href="#mandala">Frentes</a>
      <a href="#solucoes" class="k">Soluções</a>
      <button type="button" class="pdf" id="btn-pdf">Baixar PDF</button>
      <a href="#contato" class="cta">Fale com a E.UP</a>
    </nav>
  </div>
</header>

<main class="deck" id="deck" aria-label="Media Kit E.UP"></main>

<button class="review-toggle" id="review-toggle" aria-pressed="false">Notas de revisão</button>
<p class="toast" id="toast" role="status"></p>
<p class="rotate">Gire o celular para ver as páginas maiores.</p>

<script>
(function(){
var KIT, $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function nota(t){return t?'<p class="nota"><b>Revisão:</b> '+esc(t)+'</p>':''}
function fr(id){return KIT.frentes.find(function(f){return f.id===id})}
function live(p){return p.status==='ativo'}
function prods(fid){return KIT.produtos.filter(function(p){return p.frente===fid&&p.status!=='inativo'}).sort(function(a,b){return (a.ordem||99)-(b.ordem||99)})}
function date(d){return (d||'').split('-').reverse().join('/')}

fetch('data/kit.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){KIT=d;build()}).catch(function(e){
  $('#deck').innerHTML='<p style="padding:20px;background:#fee;color:#900">Não foi possível carregar os dados do media kit (data/kit.json): '+esc(e.message)+'</p>'});

var pages=[];
function page(id,cls,html,label){pages.push({id:id,cls:cls,html:html,label:label})}

function build(){
  var m=KIT.marca,c=KIT.capa;
  /* 01 CAPA */
  page('inicio','s-capa',
    '<img class="bg" src="assets/kv-capa.webp" alt="" fetchpriority="high">'+
    '<div class="social"><span>'+esc(m.site)+'</span><span>'+esc(m.social)+'</span></div>'+
    '<h1><span class="l1">'+esc(c.titulo1)+'</span><span class="l2">'+esc(c.titulo2)+'<span class="dot">.</span></span></h1>'+
    '<p class="apoio">'+esc(c.apoio)+'</p>'+
    '<div class="actions"><a class="btn solid sm" href="#solucoes">'+esc(c.cta)+' →</a><a class="btn sm" href="#mandala">Conheça as seis frentes</a></div>'+
    '<img class="lockup" src="assets/logo-lockup.png" alt="E.UP Mídias. Simplesmente diferente">','Capa');
  /* 02 QUEM SOMOS */
  var q=KIT.quemSomos;
  page('quem-somos','s-who','<div class="mist"></div><div class="l"><p class="eyebrow">Quem somos</p><p class="neither">Nem melhor.<br>Nem pior.</p><p class="diff">Diferente<span class="dot">.</span></p></div>'+
    '<p class="sig">E.UP. Simplesmente <i>diferente.</i></p>'+
    '<div class="r"><p class="pres">'+esc(q.apresentacao)+'</p><div class="mf">'+q.manifesto.map(function(l,i){return '<p'+([0,7,11].indexOf(i)>-1?' class="k"':'')+'>'+esc(l)+'</p>'}).join('')+'</div></div>','Quem somos');
  /* 03 JEITO */
  var j=KIT.jeito, rel=KIT.numeros.find(function(n){return n.id==='renovacao'});
  page('jeito','s-way','<div class="mist"></div><div class="head"><p class="eyebrow">Nosso jeito de fazer</p><h2>'+esc(j.titulo)+'</h2><p>'+esc(j.apoio)+'</p></div><div class="cols">'+
    j.territorios.map(function(t){return '<div class="col"><span class="nm">'+esc(t.nome)+'</span><p class="tt">'+esc(t.titulo)+'</p><p class="tx">'+esc(t.texto)+(t.id==='relacionamento'&&rel?'<strong>'+esc(rel.texto)+'</strong>':'')+'</p></div>'}).join('')+'</div>','Nosso jeito');
  /* 04 NÚMEROS */
  page('numeros','s-num','<div class="head"><p class="eyebrow">Nossos números</p><h2>Não pensamos em formatos. <span class="serif">Pensamos em possibilidades.</span></h2></div><div class="grid">'+
    KIT.numeros.map(function(n){var w=/[a-z]/i.test(n.valor);return '<div class="t'+(n.id==='renovacao'?' hl':'')+'"><span class="v'+(w?' w':'')+'">'+esc(n.valor)+'</span><span class="r">'+esc(n.rotulo)+'</span><p class="x">'+esc(n.id==='renovacao'?'Conquistar é importante. Permanecer é outra história.':n.texto)+'</p></div>'}).join('')+'</div>','Números');
  /* 05 MANDALA */
  page('mandala','s-man','<div class="mist"></div><div class="l"><p class="eyebrow">Seis frentes de atuação</p><h2>Um ecossistema. <span class="serif">Seis caminhos.</span></h2><p class="hint">Toque em uma frente para ver as soluções que fazem parte dela.</p><div class="panel" id="m-panel" aria-live="polite"></div></div>'+
    '<div class="wheel"><svg id="m-svg" viewBox="-130 -10 960 720" role="group" aria-label="Mandala E.UP com as seis frentes de atuação"></svg></div><div class="tip" id="m-tip"></div>'+nota(KIT.frentesNota),'Frentes');
  /* 06 MENU */
  page('solucoes','miolo s-menu','<img class="bg" src="assets/kv-miolo.webp" alt=""><div class="head"><p class="eyebrow">Menu de soluções</p><h2>Explore soluções por <span class="serif">desafio, contexto e objetivo.</span></h2></div>'+
    '<div class="cols">'+
    KIT.frentes.map(function(f){return '<div class="c"><h3 style="border-color:'+f.cor+'">'+esc(f.nome)+'</h3><ul>'+prods(f.id).map(function(p){return '<li>'+(live(p)?'<a href="#p-'+p.id+'">'+esc(p.nome)+'</a>':'<span>'+esc(p.nome)+'</span>')+'</li>'}).join('')+'</ul></div>'}).join('')+'</div>','Menu');
  /* PRODUTOS */
  KIT.frentes.forEach(function(f){prods(f.id).filter(live).forEach(productPages)});
  /* FUNIL COMPLETO (exemplo) */
  if(KIT.funil){var fu=KIT.funil, byId={}; KIT.produtos.forEach(function(p){byId[p.id]=p});
    page('funil','miolo pg','<img class="bg" src="assets/kv-miolo.webp" alt=""><div class="back"><a class="btn sm" href="#solucoes">← Voltar ao menu</a></div><div class="content">'+head(fu)+'<div class="bd"><div class="main"><div class="funil">'+
      fu.etapas.map(function(e,i){return '<div class="et"><span class="n">'+String(i+1).padStart(2,'0')+'</span><h4>'+esc(e.titulo)+'</h4><div class="chips">'+e.produtos.map(function(x){return typeof x==='string'?{id:x}:x}).filter(function(x){return byId[x.id]&&live(byId[x.id])}).map(function(x){return '<a href="#p-'+x.id+'"'+(x.rotulo?' class="dest"':'')+'>'+esc(x.rotulo||byId[x.id].nome)+'</a>'}).join('')+'</div></div>'}).join('')+
      '</div>'+foot(fu)+'</div></div></div>','Funil completo');}
  /* ENCERRAMENTO */
  var e=KIT.encerramento;
  page('contato','s-end','<img class="bg" src="assets/kv-encerramento.webp" alt=""><div class="head"><p class="eyebrow">Vamos conversar?</p><h2 style="margin-top:22px">'+esc(e.titulo)+' <span class="serif">'+esc(e.apoio)+'</span></h2></div>'+
    '<img class="lockup" src="assets/logo-lockup.png" alt="E.UP Mídias. Simplesmente diferente"><img class="qr" src="'+esc(e.qr)+'" alt="QR code para o WhatsApp comercial da E.UP">'+
    '<div class="contacts"><div><small>Site · redes</small>e-up.tech · /eupbr</div><a class="btn solid sm" href="'+esc(e.whatsappLink)+'">'+esc(e.cta)+' →</a></div>'+nota(e.pendencia),'Contato');

  var deck=$('#deck');
  deck.innerHTML=pages.map(function(p,i){return '<section class="frame" id="'+p.id+'" aria-label="'+esc(p.label)+'"><div class="slide '+p.cls+'">'+p.html+'<span class="pgnum">'+String(i+1).padStart(2,'0')+'</span></div></section>'}).join('');
  setupScale(); buildMandala(); setupReview(); setupPdf(); fitAll(); if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitAll); window.addEventListener('load',fitAll);
  if(location.hash){var t=document.getElementById(location.hash.slice(1)); if(t) setTimeout(function(){t.scrollIntoView()},60)}
}

/* PÁGINAS DE PRODUTO (motor de layouts) */
function backBtns(){return '<div class="back"><a class="btn sm" href="#solucoes">← Voltar ao menu</a></div>'}
function frontTag(f){return '<p class="front"><i style="background:'+f.cor+'"></i>'+esc(f.nome)+'</p>'}
function img(src,alt){return '<img src="'+esc(src)+'" alt="'+esc(alt||'')+'" loading="lazy">'}
function vcls(v){return String(v).length>7?' long':''}
function tiles(items,cols,hl){return '<div class="tiles'+(hl?' hl':'')+'" style="grid-template-columns:repeat('+cols+',minmax(0,1fr))">'+items.map(function(t){return '<div class="tile"><span class="v'+vcls(t.valor)+'">'+esc(t.valor)+'</span><span class="r">'+esc(t.rotulo)+'</span></div>'}).join('')+'</div>'}
function lists(ls){return '<div class="lists">'+ls.map(function(l){return '<div class="lst"><h4>'+esc(l.titulo)+'</h4><ul>'+l.itens.map(function(i){return '<li>'+esc(i)+'</li>'}).join('')+'</ul></div>'}).join('')+'</div>'}
function logos(ls){return ls&&ls.length?'<div class="logos">'+ls.map(function(s){return img(s,'')}).join('')+'</div>':''}
function cards(cs,cols){return '<div class="cards" style="grid-template-columns:repeat('+cols+',minmax(0,1fr))">'+cs.map(function(c){return '<div class="card">'+(c.valor?'<span class="cv">'+esc(c.valor)+'</span>':'')+'<h4>'+esc(c.titulo)+'</h4><p>'+esc(c.texto)+'</p></div>'}).join('')+'</div>'}
function head(g){return '<div class="hd">'+(g.eyebrow?'<p class="eb">'+esc(g.eyebrow)+'</p>':'')+(g.titulo?'<h3>'+esc(g.titulo)+'</h3>':'')+(g.intro?'<p class="in">'+esc(g.intro)+'</p>':'')+'</div>'}
function foot(g){return (g.faixa?'<p class="faixa">'+esc(g.faixa)+'</p>':'')+(g.fonte?'<p class="src">Fonte: '+esc(g.fonte)+'</p>':'')+(g.nota?'<p class="src">'+esc(g.nota)+'</p>':'')}
function side(g,narrow){if(g.logosLado)return '<div class="side"><div class="lgs">'+g.logosLado.map(function(l){return img(l,'')}).join('')+'</div></div>';if(g.imagem)return '<div class="side">'+(g.imagemFoto?'<img class="foto" src="'+esc(g.imagem)+'" alt="" loading="lazy">':img(g.imagem,''))+'</div>';if(g.imagens)return '<div class="side">'+g.imagens.map(function(s){return img(s,'')}).join('')+'</div>';return ''}
function chart(g){
  var tot=g.dados.reduce(function(s,x){return s+x.valor},0),a=-Math.PI/2,R=180,r=112,o='';
  g.dados.forEach(function(x,i){var a1=a+2*Math.PI*x.valor/tot,lg=(a1-a)>Math.PI?1:0,P=function(rr,aa){return (190+rr*Math.cos(aa)).toFixed(1)+' '+(190+rr*Math.sin(aa)).toFixed(1)};
    o+='<path d="M'+P(R,a)+' A'+R+' '+R+' 0 '+lg+' 1 '+P(R,a1)+' L'+P(r,a1)+' A'+r+' '+r+' 0 '+lg+' 0 '+P(r,a)+' Z" fill="'+COLORS[i%4]+'" stroke="#F4F3F5" stroke-width="4"/>';a=a1});
  o+='<text x="190" y="198" text-anchor="middle" style="font:600 64px Outfit,sans-serif;fill:#17183B">'+g.dados[0].valor+'%</text><text x="190" y="236" text-anchor="middle" style="font:600 20px Figtree,sans-serif;fill:#5D5A78">'+esc(g.dados[0].rotulo)+'</text>';
  return '<div class="chart"><h4>'+esc(g.titulo)+'</h4><svg viewBox="0 0 380 380" role="img" aria-label="'+esc(g.titulo)+'">'+o+'</svg><ul class="legend">'+g.dados.map(function(x,i){return '<li><i style="background:'+COLORS[i%4]+'"></i>'+esc(x.rotulo)+'<b>'+x.valor+'%</b></li>'}).join('')+'</ul><p class="fs">Fonte: '+esc(g.fonte)+'</p></div>';
}
var COLORS=['#CC1338','#4A3F7C','#FD3A60','#D7C5ED'];
var LAYOUT={
 numeros:function(g){
   var main='';
   if(g.grupos) main=g.grupos.map(function(gr){return '<p class="gt">'+esc(gr.titulo)+'</p>'+tiles(gr.itens,Math.min(gr.itens.length,4),false)}).join('');
   else{var n=g.itens.length,c=g.listas||g.imagem?(n>4?3:Math.min(n,2)):(n<=4?n:(n%3===0||n===5?3:4)); main=tiles(g.itens,c,true)}
   main+=logos(g.logos)+foot(g);
   var sd=g.listas?'<div class="side narrow">'+lists(g.listas)+'</div>':side(g);
   return head(g)+'<div class="bd"><div class="main">'+main+'</div>'+sd+'</div>'},
 destaque:function(g){
   var right=g.grafico?chart(g.grafico):(g.cards?cards(g.cards,g.cards.length===3?1:2):'');
   return '<div class="bd" style="gap:2.4em"><div class="main big" style="flex:0 0 40%"><span class="v'+(String(g.valor).length>6?' xlong':(String(g.valor).length>4?' long':''))+'">'+esc(g.valor)+'</span><span class="r">'+esc(g.rotulo)+'</span>'+foot(g)+'</div><div class="main" style="justify-content:center">'+right+'</div></div>'},
 cards:function(g){
   var hasSide=g.imagem||g.imagens, cols=g.cols||Math.min(g.cards.length,3); if(hasSide)cols=Math.min(cols,2);
   return head(g)+'<div class="bd"><div class="main" style="justify-content:center">'+cards(g.cards,cols)+logos(g.logos)+foot(g)+'</div>'+side(g)+'</div>'},
 texto:function(g){
   var main='<div class="pars">'+(g.paragrafos||[]).map(function(p){return '<p>'+esc(p)+'</p>'}).join('')+'</div>'+(g.stats?tiles(g.stats,g.stats.length,true):'');
   var l=g.lista?lists([{titulo:g.listaTitulo||'',itens:g.lista}]):'';
   var sd;
   if(g.imagem||g.logosLado){main+=l;sd=side(g)} else sd=l?'<div class="side narrow">'+l+'</div>':'';
   main+=logos(g.logos)+foot(g);
   return head(g)+'<div class="bd"><div class="main">'+main+'</div>'+sd+'</div>'},
 spec:function(g){
   var n=g.colunas.length,sp='<div class="spec" style="grid-template-columns:repeat('+n+',minmax(0,1fr))">'+g.colunas.map(function(c){return '<div><h4>'+esc(c.titulo)+'</h4><ul>'+c.itens.map(function(i){return '<li>'+esc(i)+'</li>'}).join('')+'</ul></div>'}).join('')+'</div>';
   return head(g)+'<div class="bd"><div class="main">'+sp+(g.cards?cards(g.cards,g.cards.length):'')+logos(g.logos)+foot(g)+'</div>'+side(g)+'</div>'},
 passos:function(g){
   return head(g)+'<div class="bd"><div class="main" style="justify-content:center"><div class="steps" style="grid-template-columns:repeat('+g.passos.length+',minmax(0,1fr))">'+g.passos.map(function(p,i){return '<div class="step"><span class="n">'+String(i+1).padStart(2,'0')+'</span><h4>'+esc(p.titulo)+'</h4><p>'+esc(p.texto)+'</p></div>'}).join('')+'</div>'+foot(g)+'</div></div>'},
 galeria:function(g){
   return head(g)+'<div class="bd"><div class="main"><div class="gal" style="grid-template-columns:repeat('+g.imagens.length+',minmax(0,1fr))">'+g.imagens.map(function(m){var t=String(m.legenda||'').split(':');return '<figure>'+img(m.src,m.legenda)+'<figcaption>'+(t.length>1?'<b>'+esc(t[0])+':</b>'+esc(t.slice(1).join(':')):'<b>'+esc(m.legenda||'')+'</b>')+'</figcaption></figure>'}).join('')+'</div>'+foot(g)+'</div></div>'},
 tabela:function(g){
   return head(g)+'<div class="bd"><div class="main"><table class="tbl"><thead><tr>'+g.cabecalho.map(function(h){return '<th>'+esc(h)+'</th>'}).join('')+'</tr></thead><tbody>'+g.linhas.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table>'+foot(g)+'</div></div>'}
};
function productPages(p){
  var f=fr(p.frente), base='<img class="bg" src="assets/kv-miolo.webp" alt="">'+backBtns()+frontTag(f), im=p.imagem;
  var art;
  if(im&&p.arte==='circulo') art='<div class="art circulo"><div class="ph">'+img(im.src,im.alt)+'</div></div>';
  else if(im&&p.arte==='base-circulo') art='<div class="art base"><div class="wr">'+img(im.src,im.alt)+'</div></div>';
  else if(im) art='<div class="art'+(p.foto?' photo':'')+'">'+img(im.src,im.alt)+'</div>';
  else if(p.logosArte) art='<div class="art"><div class="lg multi">'+p.logosArte.map(function(l){return img(l,'')}).join('')+'</div></div>';
  else { var L=p.nome.length, fz=L<=9?64:(L<=14?52:(L<=20?42:36)); art='<div class="art"><div class="lg">'+(p.logo?img(p.logo,p.nome):'<b style="font-size:'+fz+'px">'+esc(p.nome)+'</b>')+'</div></div>'; }
  var top=p.logo&&(im||p.logosArte)?'<img class="logo" src="'+esc(p.logo)+'" alt="'+esc(p.nome)+'">':'<h2 class="nm'+(p.nome.length>13?' long':'')+'">'+esc(p.nome)+'</h2>';
  page('p-'+p.id,'miolo p-open',base+'<div class="left">'+top+'<p class="call">'+esc(p.chamada)+'</p><p class="desc">'+esc(p.descricao)+'</p></div>'+art,p.nome);
  (p.paginas||[]).forEach(function(g,i){var fn=LAYOUT[g.tipo]; if(!fn)return;
    page('p-'+p.id+'-'+(i+2),'miolo pg',base+'<div class="content">'+fn(g)+'</div>',p.nome+(g.eyebrow?' · '+g.eyebrow:''))});
}
/* ajusta o texto para caber na página */
function fitAll(){
  document.querySelectorAll('.pg .content').forEach(function(c){
    var fs=34; c.style.fontSize=fs+'px';
    while((c.scrollHeight>c.clientHeight+2||c.scrollWidth>c.clientWidth+2)&&fs>15){fs-=1;c.style.fontSize=fs+'px'}
  });
  document.querySelectorAll('.p-open .left').forEach(function(l){var d=l.querySelector('.desc'),c=l.querySelector('.call'),fs=27,cs=70;d.style.fontSize=fs+'px';c.style.fontSize=cs+'px';while(l.scrollHeight>l.clientHeight+2&&fs>17){fs--;cs-=2;d.style.fontSize=fs+'px';c.style.fontSize=cs+'px'}});
}

/* ESCALA DAS PÁGINAS */
function setupScale(){
  var first=$('.frame');
  function fit(){document.documentElement.style.setProperty('--s',(first.clientWidth/1920).toFixed(5))}
  fit(); if('ResizeObserver' in window) new ResizeObserver(fit).observe(first); else window.addEventListener('resize',fit);
}

/* MANDALA */
function polar(r,a){return [350+r*Math.cos(a),350+r*Math.sin(a)]}
function sector(r0,r1,a0,a1){var p=[polar(r1,a0),polar(r1,a1),polar(r0,a1),polar(r0,a0)],lg=(a1-a0)>Math.PI?1:0;return 'M'+p[0]+' A'+r1+' '+r1+' 0 '+lg+' 1 '+p[1]+' L'+p[2]+' A'+r0+' '+r0+' 0 '+lg+' 0 '+p[3]+' Z'}
function buildMandala(){
  var svg=$('#m-svg'),F=KIT.frentes,step=2*Math.PI/F.length,gap=.035,o='<circle cx="350" cy="350" r="262" fill="none" stroke="rgba(23,24,59,.13)" stroke-dasharray="2 6"/>';
  F.forEach(function(f,i){
    var a0=-Math.PI/2+i*step+gap,a1=-Math.PI/2+(i+1)*step-gap,mid=(a0+a1)/2,ps=prods(f.id),k=ps.length;
    o+='<g class="seg" data-f="'+f.id+'" tabindex="0" role="button" aria-label="'+esc(f.nome)+', '+k+' soluções"><path d="'+sector(108,222,a0,a1)+'" fill="'+f.cor+'" fill-opacity=".93"/><path d="'+sector(108,124,a0,a1)+'" fill="#fff" fill-opacity=".18"/>';
    ps.forEach(function(p,jx){var pt=polar(262,a0+(a1-a0)*(jx+.5)/k);o+='<circle class="pdot" data-p="'+p.id+'" data-n="'+esc(p.nome)+'" cx="'+pt[0].toFixed(1)+'" cy="'+pt[1].toFixed(1)+'" r="'+(live(p)?8:5.5)+'" fill="'+(live(p)?f.cor:'#F6F4F8')+'" stroke="'+f.cor+'" stroke-width="2"/>'});
    var c=polar(170,mid);o+='<text x="'+c[0].toFixed(1)+'" y="'+(c[1]+10).toFixed(1)+'" text-anchor="middle" style="font:600 30px Outfit,sans-serif;fill:#fff;pointer-events:none">'+k+'</text>';
    var L=polar(305,mid),an=Math.cos(mid)>.25?'start':(Math.cos(mid)<-.25?'end':'middle'),w=f.nome.split(' '),lines=f.nome.length>18?[w.slice(0,Math.ceil(w.length/2)).join(' '),w.slice(Math.ceil(w.length/2)).join(' ')]:[f.nome],y0=L[1]-(lines.length-1)*9+5;
    o+='<text class="lbl" text-anchor="'+an+'">'+lines.map(function(l,li){return '<tspan x="'+L[0].toFixed(1)+'" y="'+(y0+li*19).toFixed(1)+'">'+esc(l)+'</tspan>'}).join('')+'</text></g>';
  });
  o+='<circle cx="350" cy="350" r="94" fill="#fff" stroke="rgba(23,24,59,.1)"/><image href="assets/logo-eup.png" x="290" y="300" width="120" height="67"/><text x="350" y="398" text-anchor="middle" style="font:600 12px Figtree,sans-serif;letter-spacing:.14em;fill:#5D5A78">36+ SOLUÇÕES</text>';
  svg.innerHTML=o;
  svg.addEventListener('click',function(e){var d=e.target.closest('.pdot');if(d){var p=KIT.produtos.find(function(x){return x.id===d.dataset.p});if(live(p))location.hash='p-'+p.id;else sel(p.frente);return}var g=e.target.closest('.seg');if(g)sel(g.dataset.f)});
  svg.addEventListener('keydown',function(e){var g=e.target.closest('.seg');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();sel(g.dataset.f)}});
  var tip=$('#m-tip'),slide=svg.closest('.slide');
  svg.addEventListener('mousemove',function(e){var d=e.target.closest('.pdot');if(!d){tip.style.opacity=0;return}var r=slide.getBoundingClientRect(),s=r.width/1920;tip.textContent=d.dataset.n;tip.style.left=((e.clientX-r.left)/s+18)+'px';tip.style.top=((e.clientY-r.top)/s-50)+'px';tip.style.opacity=1});
  svg.addEventListener('mouseleave',function(){tip.style.opacity=0});
  sel(F[0].id);
}
function sel(fid){
  var f=fr(fid),ps=prods(fid),svg=$('#m-svg'),n=ps.filter(live).length;svg.classList.add('has');
  svg.querySelectorAll('.seg').forEach(function(g){g.classList.toggle('sel',g.dataset.f===fid);g.setAttribute('aria-pressed',g.dataset.f===fid)});
  $('#m-panel').innerHTML='<p class="fr"><i style="background:'+f.cor+'"></i>Frente de atuação</p><h3>'+esc(f.nome)+'</h3><p class="cnt">'+ps.length+' soluções'+(n?' · '+n+' disponível':'')+'</p><ul>'+
    ps.map(function(p){return '<li>'+(live(p)?'<a href="#p-'+p.id+'">'+esc(p.nome)+' <span class="tag live">Ver</span></a>':'<span class="o">'+esc(p.nome)+' <span class="tag mig">Em migração</span></span>')+'</li>'}).join('')+'</ul>';
}

/* NOTAS DE REVISÃO */
function toast(t){var el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){el.classList.remove('on')},4500)}
function setupPdf(){
  var b=$('#btn-pdf'); if(!b)return;
  b.addEventListener('click',function(){
    var inFrame=false; try{inFrame=window.self!==window.top}catch(e){inFrame=true}
    if(inFrame){toast('O download em PDF funciona no site: eupmidiakit.netlify.app');return}
    toast('Preparando o PDF… na janela de impressão, escolha “Salvar como PDF”.');
    var imgs=[].slice.call(document.images); imgs.forEach(function(i){i.loading='eager'});
    Promise.all(imgs.map(function(i){return i.complete?0:new Promise(function(r){i.onload=i.onerror=r})})).then(function(){
      document.documentElement.style.setProperty('--s','1'); fitAll();
      setTimeout(function(){try{window.print()}catch(e){toast('Não foi possível abrir a impressão neste navegador.')}},300);
    });
  });
  window.addEventListener('afterprint',function(){var f=$('.frame');document.documentElement.style.setProperty('--s',(f.clientWidth/1920).toFixed(5))});
}
function setupReview(){
  var b=$('#review-toggle'),on=false;try{on=localStorage.getItem('eup-review')==='1'}catch(e){}
  function set(v){document.body.classList.toggle('review',v);b.setAttribute('aria-pressed',v);try{localStorage.setItem('eup-review',v?'1':'0')}catch(e){}}
  set(on);b.addEventListener('click',function(){on=!on;set(on)});
}
})();
</script>
