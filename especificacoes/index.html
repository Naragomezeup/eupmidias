<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Especificações Técnicas E/UP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Mundo visual E/UP (KV 2026): papel acinzentado com brilhos lilás e rosa, tinta azul-noite, magenta de destaque e o ponto vermelho da marca. */
  /* Layout: cabeçalho fixo → busca e filtros → grade de cartões; detalhe e campanha em painéis de leitura. */
  --paper:#F3F2F5;
  --card:#FFFFFF;
  --ink:#0F1534;
  --muted:#5E6077;
  --line:#E3E1EA;
  --magenta:#FF2D5F;
  --red:#CE1138;
  --violet:#7A3FE4;
  --lilac:#D9CCF5;
  --blush:#FFD3DE;
  --warn-bg:#FFF4D6; --warn-ink:#7A5200; --warn-line:#F1D48A;
  --ok:#137A4B; --ok-bg:#E3F5EC;
  --f-display:"Instrument Serif", "Times New Roman", serif;
  --f-body:"Outfit", "Helvetica Neue", Arial, sans-serif;
  --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(40vw 30vw at 0% 0%, rgba(183,156,240,.45), transparent 70%),
             radial-gradient(38vw 32vw at 100% 4%, rgba(255,45,95,.22), transparent 70%),
             radial-gradient(40vw 28vw at 100% 100%, rgba(95,80,170,.18), transparent 70%)}
a{color:var(--violet)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(243,242,245,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:66px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand img{height:34px;width:auto;display:block}
.nav{display:flex;gap:4px;margin-left:auto;align-items:center;flex-wrap:wrap}
.nav a{padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:500;font-size:15px;white-space:nowrap}
.nav a[aria-current="page"]{background:var(--ink);color:#fff}
.nav a .count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--magenta);color:#fff;font-size:12px;font-weight:700}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:#fff}
.lang button{border:0;background:none;padding:5px 10px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--magenta);color:#fff}

/* hero */
.hero{padding:44px 0 18px}
.hero h1{font-family:var(--f-body);font-weight:300;font-size:clamp(34px,5.4vw,62px);line-height:1.02;letter-spacing:-.02em}
.hero h1 em{font-family:var(--f-display);font-style:italic;font-weight:400;letter-spacing:-.01em}
.hero h1 .dot{color:var(--red)}
.hero p.sub{font-weight:600;font-size:clamp(17px,2vw,21px);max-width:38ch;margin:14px 0 0}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip b{color:var(--ink);font-weight:700}
.chip.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.chip.snap::before{content:"";width:8px;height:8px;border-radius:50%;background:#C9A227}

.tools{display:grid;gap:14px;margin:26px 0 8px}
.search{position:relative}
.search input{width:100%;height:56px;border-radius:16px;border:1px solid var(--line);background:#fff;padding:0 18px 0 50px;font-size:17px;box-shadow:0 6px 24px rgba(15,21,52,.06)}
.search svg{position:absolute;left:18px;top:18px;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;padding:18px 0 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;position:relative;transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:0 10px 30px rgba(15,21,52,.09)}
.card.sel{border-color:var(--magenta);box-shadow:0 0 0 2px rgba(255,45,95,.25)}
.card .cat{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--magenta)}
.card h3{font-size:21px;font-weight:700;line-height:1.15}
.card p{margin:0;color:var(--muted);font-size:14.5px}
.card .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto;padding-top:6px}
.card .actions .btn{padding:9px 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;line-height:1.1}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.pink{background:var(--magenta);border-color:var(--magenta)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.danger{background:#fff;color:var(--red);border-color:#F2B8C4}
.check{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;cursor:pointer;user-select:none}
.check input{width:18px;height:18px;accent-color:var(--magenta)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 0}

/* detail */
.back{display:inline-flex;gap:6px;align-items:center;margin:26px 0 10px;color:var(--muted);text-decoration:none;font-weight:500}
.dhead{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;padding-bottom:18px;border-bottom:1px solid var(--line)}
.dhead h1{font-size:clamp(32px,4.6vw,52px);font-weight:700;letter-spacing:-.02em;line-height:1.02}
.dhead .cat{color:var(--magenta);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px;margin-bottom:6px}
.dhead .tag{color:var(--muted);margin-top:8px}
.dmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.dactions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--magenta);border-color:var(--magenta);color:#fff}
.fmt{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin:0 0 16px;overflow:hidden}
.fmt>header{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.fmt h2{font-size:20px;font-weight:700}
.fmt .intro{padding:12px 18px 0;margin:0;color:var(--muted);font-size:14.5px}
.tbl{overflow-x:auto;padding:12px 18px 16px}
table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
th{background:var(--ink);color:#fff;text-align:left;font-weight:600;padding:9px 12px;font-size:13px;letter-spacing:.02em}
th:first-child{border-top-left-radius:8px}th:last-child{border-top-right-radius:8px}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:#FAF9FC}
td.k{font-weight:600;width:34%;min-width:150px}
.pend{display:inline-block;background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);border-radius:6px;padding:1px 7px;font-size:13px;font-weight:600}
.reveal{border:1px dashed var(--violet);background:#F6F2FF;color:var(--violet);border-radius:6px;padding:1px 8px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.email-shown{font-weight:600;color:var(--ink)}
.email-shown button{margin-left:6px}
.tr-flag{color:var(--violet);font-weight:700;cursor:help}
.notes{padding:0 18px 16px;margin:0;font-size:14px;color:var(--muted)}
.block{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;margin:0 0 16px}
.block h2{font-size:18px;font-weight:700;margin-bottom:8px}
.block h3{font-size:15px;font-weight:700;margin:12px 0 4px;color:var(--magenta)}
.block ul{margin:0;padding-left:20px}
.block li{margin:4px 0;max-width:80ch}
.block.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink)}
.src{font-size:13px;color:var(--muted);margin:6px 0 120px}

/* campaign */
.camp{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;padding:10px 0 120px;align-items:start}
@media (max-width:860px){.camp{grid-template-columns:1fr}.dhead{grid-template-columns:1fr}.dactions{justify-content:flex-start}}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel h2{font-size:20px;font-weight:700;margin-bottom:12px}
.selitem{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:6px}
.selitem:first-of-type{border-top:0}
.selitem .row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.selitem strong{font-size:16px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 11px;font-size:13px;background:#FAF9FC}
.fpick{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.fchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.fchip[aria-pressed="true"]{background:var(--magenta);border-color:var(--magenta);color:#fff}
.pill.off{opacity:.5;text-decoration:line-through}
.pill button{border:0;background:var(--line);border-radius:50%;width:20px;height:20px;cursor:pointer;line-height:1;font-size:13px}
label.f{display:grid;gap:5px;font-size:14px;font-weight:600;margin-bottom:12px}
label.f span.o{font-weight:400;color:var(--muted)}
input.t,select.t,textarea.t{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-weight:400;width:100%}
textarea.t{min-height:80px;resize:vertical}

/* sticky bar */
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:30;background:var(--ink);color:#fff;border-radius:16px;padding:10px 10px 10px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 14px 40px rgba(15,21,52,.3);width:min(720px,calc(100% - 32px))}
.bar .txt{flex:1;font-size:14.5px}
.bar .txt b{font-variant-numeric:tabular-nums}

/* toast / modal */
.toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.modal-bg{position:fixed;inset:0;background:rgba(15,21,52,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:18px;max-width:520px;width:100%;padding:22px;display:grid;gap:12px}
.modal h2{font-size:21px;font-weight:700}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* footer */
.foot{background:linear-gradient(90deg,#E81F55 0%,#FF3A68 55%,#FFB5C8 100%);color:#fff}
.foot .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;flex-wrap:wrap}
.foot strong{font-weight:700;font-size:17px}
.foot img{height:30px}
.foot small{display:block;opacity:.9;font-size:12.5px;color:var(--ink)}

/* admin */
.adm{padding:10px 0 120px}
.adm table td,.adm table th{font-size:14px}
.status{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.02em}
.st-published{background:var(--ok-bg);color:var(--ok)}
.st-draft{background:#EEE9FB;color:var(--violet)}
.st-review{background:var(--warn-bg);color:var(--warn-ink)}
.st-archived{background:#ECECF0;color:var(--muted)}
.st-off{background:#FBE3E8;color:var(--red)}
.ed{display:grid;gap:14px}
.ed fieldset{border:1px solid var(--line);border-radius:12px;padding:14px;margin:0;background:#fff}
.ed legend{font-weight:700;padding:0 6px}
.ed .rowi{display:grid;grid-template-columns:1fr 1.6fr auto;gap:8px;margin-bottom:8px;align-items:start}
.ed .rowi.one{grid-template-columns:1fr auto}
.ed .cells{display:grid;gap:8px;margin-bottom:8px;align-items:start}
.ed input.t,.ed textarea.t{padding:8px 10px;font-size:14px}
.ed textarea.t{min-height:40px}
.ed .ref{font-size:12px;color:var(--muted);margin-top:2px}
.ed .x{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:36px;cursor:pointer;color:var(--red)}
.edlang{position:sticky;top:66px;z-index:5;background:var(--paper);padding:10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.warnlist{margin:0;padding-left:18px;font-size:14px}
@media (max-width:640px){
  .top .wrap{height:auto;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
  .nav{margin-left:0;width:100%;gap:2px}
  .nav .lang{margin-left:auto}
  .nav a{padding:7px 10px;font-size:14px}
  .ed .rowi{grid-template-columns:1fr auto}.ed .rowi>*:nth-child(2){grid-column:1/2}
  .bar{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ───────── estado ───────── */
const S = {
  lang: 'pt', cat: 'all', q: '',
  sel: {},               // mediaId -> array de formatIds
  tab: {},               // mediaId -> formatId | 'all'
  media: {},             // id -> registro publicado {media, version, updated, active, ...}
  live: false,           // dados vindos do banco
  db: null, user: null, canEdit: false, downloads: undefined,
  drafts: {}, internal: {}, history: [],
  form: { client:'', campaign:'', agency:'', notes:'', lang:null },
};
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem('eup-specs-'+k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem('eup-specs-'+k, JSON.stringify(v)); }catch(e){} }
};
const L = () => I18N[S.lang];
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const PEND_RE = /(Informação técnica pendente de validação|Technical information pending validation|Información técnica pendiente de validación)/;

function tr(x, lang){ lang = lang || S.lang; if (x == null) return ''; if (typeof x === 'string') return x; return (x[lang] && String(x[lang]).trim()) ? x[lang] : (x.pt || ''); }
function trMissing(x, lang){ lang = lang || S.lang; return x && typeof x === 'object' && lang !== 'pt' && !(x[lang] && String(x[lang]).trim()); }
function fmtDate(iso, lang){ if(!iso) return '—'; const [y,m,d] = iso.slice(0,10).split('-').map(Number); return new Date(Date.UTC(y,m-1,d,12)).toLocaleDateString(LOCALE[lang||S.lang], lang==='en'||(!lang&&S.lang==='en') ? {month:'short',day:'numeric',year:'numeric',timeZone:'UTC'} : {day:'2-digit',month:'2-digit',year:'numeric',timeZone:'UTC'}); }
function norm(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
const EMAIL_RE = /\{\{email:([A-Za-z0-9+/=]+)\}\}/g;
function unEmail(s){ return String(s).replace(EMAIL_RE, (m, b) => { try { return atob(b); } catch(e){ return ''; } }); }
function txt(x){ // html para célula: destaca pendências e traduções faltantes
  const s = tr(x); let h = esc(s).replace(PEND_RE, '<span class="pend">$1</span>').replace(EMAIL_RE, (m, b) => `<button type="button" class="reveal" data-email="${b}">${L().showEmail}</button>`);
  if (trMissing(x)) h += ` <span class="tr-flag" title="${esc(L().trFlag)}">†</span>`;
  return h;
}

/* ───────── base ───────── */
function seedFromBase(){
  BASE.media.forEach(m => { S.media[m.id] = { media: m, version: m.version || BASE.library.version, updated: m.updated || BASE.library.updated, active: m.active !== false, status: 'published', translations: {en:'ok', es:'ok'}, log: m.log || [] }; });
}
function list(){ return Object.values(S.media).filter(r => r.active !== false).sort((a,b)=>(a.media.order||99)-(b.media.order||99) || a.media.name.localeCompare(b.media.name)); }
function rec(id){ return S.media[id]; }
function libStamp(){ if (!BASE) return { v:'—', d:'' }; let v = BASE.library.version, d = BASE.library.updated; Object.values(S.media).forEach(r => { if (r.updated > d) d = r.updated; }); return { v, d }; }
function catName(id){ const c = BASE.categories.find(c=>c.id===id); return c ? tr(c.name) : id; }

/* seleção */
function selCount(){ let n=0, m=0; for (const id in S.sel){ if (!rec(id) || rec(id).active===false) continue; const k = S.sel[id].filter(f => rec(id).media.formats.some(x=>x.id===f)).length; if (k){ n+=k; m++; } } return {n, m}; }
function isSel(id, f){ return !!(S.sel[id] && S.sel[id].includes(f)); }
function toggleFmt(id, f, on){ const a = S.sel[id] || []; const has = a.includes(f); if (on === undefined) on = !has; if (on && !has) a.push(f); if (!on && has) a.splice(a.indexOf(f),1); if (a.length) S.sel[id] = a; else delete S.sel[id]; store.set('sel', S.sel); }
function toggleMedia(id, on){ const r = rec(id); if (!r) return; r.media.formats.forEach(f => toggleFmt(id, f.id, on)); }
function mediaFullySel(id){ const r = rec(id); return r && r.media.formats.length && r.media.formats.every(f => isSel(id, f.id)); }
function mediaAnySel(id){ return !!(S.sel[id] && S.sel[id].length); }

function matches(r){
  if (S.cat !== 'all' && r.media.cat !== S.cat) return false;
  if (!S.q.trim()) return true;
  const m = r.media; const hay = norm([m.name, tr(m.names), tr(m.tagline), m.keywords, catName(m.cat), ...m.formats.map(f=>tr(f.name)), m.access ? tr(m.access.title) : '',
    ...m.formats.flatMap(f => [...(f.specs||[]).map(s=>tr(s[1])), ...((f.table&&f.table.rows)||[]).flat().map(c=>tr(c))])].join(' '));
  return norm(S.q).split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}
function renderGrid(){
  const g = document.getElementById('grid'); if (!g) return;
  const items = list().filter(matches);
  if (!items.length){ g.innerHTML = `<p class="empty">${L().noResults}</p>`; return; }
  g.innerHTML = items.map(r => { const m = r.media; const full = mediaFullySel(m.id), any = mediaAnySel(m.id);
    return `<article class="card ${any?'sel':''}">

      <h3>${esc(tr(m.names)||m.name)}</h3>

      ${m.formats.length===1

      <div class="actions">
        <a class="btn" href="#m-${m.id}">${L().view}</a>
        <button type="button" class="btn ghost" data-pdf="${m.id}">${L().pdf}</button>
      </div>
    </article>`; }).join('');
}

  let h = '';

  if (f.specs && f.specs.length){ h += `<div class="tbl"><table><thead><tr><th scope="col">${L().spec}</th><th scope="col">${L().value}</th></tr></thead><tbody>${f.specs.map(s=>`<tr><td class="k">${txt(s[0])}</td><td>${txt(s[1])}</td></tr>`).join('')}</tbody></table></div>`; }
  if (f.notes && f.notes.length) h += `<p class="notes">${f.notes.map(txt).join('<br>')}</p>`;
  if (f.links && f.links.length) h += `<p class="notes">${f.links.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(tr(l.label))} ↗</a>`).join('<br>')}</p>`;
  return h;
}

/* ───────── PDF ───────── */
function pdfSafe(s){ return unEmail(s==null?'':s).replace(/[–—]/g,'-').replace(/[“”„]/g,'"').replace(/[‘’]/g,"'").replace(/≤/g,'<=').replace(/≥/g,'>=').replace(/…/g,'...').replace(/→/g,'->').replace(/↗/g,'').replace(/[  ]/g,' ').replace(/•/g,'-'); }

function buildPdf({ items, lang, cover }){
  const { jsPDF } = window.jspdf;

  const W = 595.28, H = 841.89, M = 40, CW = W - 2*M, TOP = 92, BOTTOM = H - 46;
  let y = TOP; let curMediaName = '';

async function deliverPdf(buf, filename){
  if (!window.claude || typeof claude.use !== 'function'){
    const url = URL.createObjectURL(new Blob([buf], { type:'application/pdf' }));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000); toast(L().saved); return;
  }
  if (S.downloads === undefined){ try { S.downloads = await claude.use('downloads'); } catch(e){ S.downloads = null; } }
  const blob = new Blob([buf], { type:'application/pdf' });
  if (S.downloads){
    try { await S.downloads.save({ filename, data: blob }); toast(L().saved); return; }
    catch(e){ if (e && e.code === 'declined'){ toast(L().declined); return; } if (e && e.code === 'rate_limited'){ toast('…'); return; } }
  }
  const url = URL.createObjectURL(blob);
  modal(`<h2>${L().ready}</h2><p>${L().dlUnavailable}</p><div class="acts"><button type="button" class="btn ghost" data-close="1">${L().close}</button><a class="btn pink" href="${url}" target="_blank" rel="noopener">${L().openPdf}</a></div>`);
}
async function pdfFor(items, lang, cover, filename){
  if (!window.jspdf){ toast('PDF engine unavailable (jsPDF)'); return; }
  toast(L().generating);
  await new Promise(r => setTimeout(r, 30));
  try { const buf = buildPdf({ items, lang, cover }); await deliverPdf(buf, filename); }
  catch(e){ console.error(e); toast('Erro ao gerar PDF: ' + (e && e.message || e)); }
}

async function connect(){

    const [db, user] = await Promise.all([claude.use('db').catch(()=>null), claude.use('user').catch(()=>null)]);
    S.db = db; S.user = user;
    if (user){ try { S.canEdit = !!(await user.canEdit()); } catch(e){ S.canEdit = false; } }
    if (db){
      db.collection('specs').onSnapshot(snap => {
        if (!snap.empty){
          const seen = new Set();
          snap.docs.forEach(d => { const v = d.data(); if (v && v.media && v.media.id){ S.media[v.media.id] = clone(v); seen.add(v.media.id); } });
          S.live = true;
        }
        if (!location.hash.startsWith('#editar-')) rerender(true); else renderNav();
      }, err => console.warn('db', err && err.code));
      if (S.canEdit && window.Admin) Admin.connect();
    }
    renderNav(); if (S.canEdit) rerender(true);
  } catch(e){ console.warn(e); }
}
</script>
